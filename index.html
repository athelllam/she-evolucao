  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fffafc" />
    <title>She</title>
    <style>
      html, body { margin: 0; padding: 0; background: #fffafc; }
      #root { min-height: 100vh; }
      #she-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #fffafc;
        opacity: 1;
        visibility: visible;
        transition: opacity .7s ease, visibility .7s ease;
      }
      #she-splash.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      #she-splash .glow {
        position: absolute;
        width: 28rem;
        height: 28rem;
        border-radius: 999px;
        background: rgba(244, 114, 182, .20);
        filter: blur(80px);
      }
      #she-splash .content { position: relative; z-index: 1; text-align: center; }
      #she-splash img {
        display: block;
        width: 208px;
        max-width: 60vw;
        margin: 0 auto;
        opacity: 0;
        transform: scale(.92);
        animation: sheSplashLogo 1s cubic-bezier(.22,1,.36,1) forwards, sheSplashFloat 4s ease-in-out 1s infinite;
      }
      #she-splash .bar {
        width: 180px;
        height: 2px;
        margin: 32px auto 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #f472b6, #ec4899);
        transform-origin: left center;
        transform: scaleX(0);
        animation: sheSplashBar 1.2s ease-out .3s forwards;
      }
      @keyframes sheSplashLogo {
        from { opacity: 0; transform: scale(.92); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes sheSplashFloat {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes sheSplashBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #she-splash img, #she-splash .bar { animation: none; opacity: 1; transform: none; }
        #she-splash .bar { transform: scaleX(1); }
      }
    </style>
  </head>
